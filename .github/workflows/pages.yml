name: Prism website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.mjs'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
      - '.node-version'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.mjs'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
      - '.node-version'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-pages-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and prepare static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Validate source and build script
        run: |
          node scripts/check-site.mjs
          node --check scripts/build-site.mjs
      - name: Prepare website and latest platform downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-site.mjs
      - name: Validate publish artifact
        run: node scripts/check-site.mjs tmp/prism-site
      - name: Upload website only
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './tmp/prism-site'

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enable Settings > Pages > Source > GitHub Actions before the first deployment.
      # Creating a Pages site requires separate repository-administrator authorization.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
