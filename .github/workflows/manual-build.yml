name: 🛠️ Manual Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Select platforms to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'macos'
          - 'linux'
          - 'windows,macos'
          - 'windows,linux'
          - 'macos,linux'
          - 'windows,macos,linux'
      upload_artifacts:
        description: 'Upload build artifacts'
        required: true
        default: true
        type: boolean
      run_tests:
        description: 'Run tests before building'
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-build-${{ github.ref }}-${{ github.run_number }}
  cancel-in-progress: true

jobs:
  plan:
    name: 🎯 Select requested platforms
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7.0.1
      - name: Select build matrix
        id: matrix
        run: node scripts/build-matrix.mjs
        env:
          BUILD_PLATFORMS: ${{ inputs.platforms }}

  test:
    name: 🧪 Test & Lint
    if: ${{ github.event.inputs.run_tests == 'true' }}
    uses: ./.github/workflows/build.yml

  build:
    name: 🏗️ Build ${{ matrix.platform }}
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # Linux specific dependencies
      - name: 🐧 Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm-dev libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev libxss1 libasound2-dev

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build shared packages
        run: pnpm build:shared

      - name: 🏗️ Build database
        run: pnpm build:database

      - name: 🏗️ Build server
        run: pnpm build:server

      - name: 📝 Create desktop production env
        shell: bash
        run: |
          cat <<EOF > apps/desktop/.env.production
          VITE_API_BASE_URL=${DESKTOP_VITE_API_BASE_URL:-http://127.0.0.1:3000}
          VITE_UPDATE_REPOSITORY=${DESKTOP_UPDATE_REPOSITORY}
          VITE_UPDATE_MANIFEST_URL=${DESKTOP_UPDATE_MANIFEST_URL}
          EOF
        env:
          DESKTOP_VITE_API_BASE_URL: ${{ vars.DESKTOP_VITE_API_BASE_URL }}
          DESKTOP_UPDATE_REPOSITORY: ${{ vars.DESKTOP_UPDATE_REPOSITORY }}
          DESKTOP_UPDATE_MANIFEST_URL: ${{ vars.DESKTOP_UPDATE_MANIFEST_URL }}

      - name: 🚀 Build desktop app
        run: pnpm --filter @ai-ssh/desktop ${{ matrix.build_script }}
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          TARGET_ARCH: ${{ matrix.target_arch }}

      - name: 🧪 Verify Windows package, installation and removal
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/ci-verify-windows-package.mjs

      - name: 📤 Upload Windows verification results
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-package-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/aissh-package-validation/results
          if-no-files-found: warn
          retention-days: 7

      - name: 📤 Upload build artifacts
        if: ${{ github.event.inputs.upload_artifacts == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: manual-build-${{ matrix.platform }}-${{ github.run_number }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

      - name: 📊 Build Summary
        shell: bash
        run: |
          echo "### 🎉 Manual build completed!" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Upload Artifacts:** ${{ github.event.inputs.upload_artifacts }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Files:**" >> $GITHUB_STEP_SUMMARY
          ls -la apps/desktop/release/*/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No release files found" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📋 Build Summary
    needs: build
    runs-on: windows-latest
    if: always()
    steps:
      - name: 🎯 Final Summary
        shell: bash
        run: |
          echo "### 🛠️ Manual Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requested Platforms:** ${{ github.event.inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tests Enabled:** ${{ github.event.inputs.run_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts Upload:** ${{ github.event.inputs.upload_artifacts }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** Manual by @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.upload_artifacts }}" == "true" ]; then
            echo "### 📦 Download Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "Artifacts are available in the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for 7 days." >> $GITHUB_STEP_SUMMARY
          fi
