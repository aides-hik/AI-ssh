# Local dependencies for the optional API server. Start the API with pnpm dev:server.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: ai-ssh-postgres
    environment:
      POSTGRES_DB: ai_ssh_assistant
      POSTGRES_USER: ai_ssh_user
      POSTGRES_PASSWORD: ai_ssh_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA below /var/lib/postgresql.
      # Use a fresh volume; the previous PostgreSQL 15 volume is left untouched.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ssh_user -d ai_ssh_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine3.23
    container_name: ai-ssh-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis8_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres18_data:
  redis8_data:
